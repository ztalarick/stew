[workspace]
members = [
    "crates/stew-core",
    "crates/stew-parser",
    "crates/stew-cli",
    "crates/stew-lsp",
    "tree-sitter-stew",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Zach Talarick <ztalarick@gmail.com>"]

[workspace.dependencies]
stew-core = { path = "crates/stew-core" }
stew-parser = { path = "crates/stew-parser" }

# Parser
tree-sitter-stew = { path = "tree-sitter-stew" }
tree-sitter = "0.26.11"

# CLI
clap = { version = "4.6.4", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.19"

# Logs/Trace
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
